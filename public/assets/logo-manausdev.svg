  <!-- </> code brackets centered in diamond -->
  <!-- < -->
  <path d="M14 15.5 L11 18 L14 20.5" stroke="#0c1f2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- > -->
  <path d="M22 15.5 L25 18 L22 20.5" stroke="#0c1f2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- / -->
  <path d="M17.5 21.5 L18.5 14.5" stroke="#0c1f2e" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
