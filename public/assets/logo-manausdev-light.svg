<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" role="img" aria-label="ManausDev logo">
  <defs>
    <linearGradient id="diamond-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#009BFD" />
      <stop offset="50%"  stop-color="#02B8B5" />
      <stop offset="100%" stop-color="#4BD76D" />
    </linearGradient>
  </defs>

  <!-- Pantone 2026 C warm white background -->
  <rect width="36" height="36" rx="8" fill="#F5F0E8" />

  <!-- Gradient diamond -->
  <rect
    x="9" y="9" width="18" height="18" rx="2"
    fill="url(#diamond-grad-light)"
    transform="rotate(45 18 18)"
  />

  <!-- < bracket -->
  <path d="M14 15.5 L11 18 L14 20.5"
    stroke="#F5F0E8" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"
    fill="none" />
  <!-- > bracket -->
  <path d="M22 15.5 L25 18 L22 20.5"
    stroke="#F5F0E8" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"
    fill="none" />
  <!-- / slash -->
  <path d="M17.5 21.5 L18.5 14.5"
    stroke="#F5F0E8" stroke-width="2"
    stroke-linecap="round"
    fill="none" />
</svg>
