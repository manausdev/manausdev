<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback do Beta - ManausDev</title>
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-container">
      <div class="card">
        <div class="card-header">
          <h1 class="card-title">Feedback do Beta</h1>
          <p class="card-body">Sua opinião ajuda a construir um ManausDev melhor para todos.</p>
        </div>

        <form id="feedbackForm" novalidate>
          <div class="form-group">
            <label class="label" for="nome">Nome</label>
            <input
              class="input"
              type="text"
              id="nome"
              name="nome"
              placeholder="Seu nome"
              required
              autocomplete="name"
            >
            <div class="error-message" id="error-nome"></div>
          </div>

          <div class="form-group">
            <label class="label" for="email">Email</label>
            <input
              class="input"
              type="email"
              id="email"
              name="email"
              placeholder="seu@email.com"
              required
              autocomplete="email"
            >
            <div class="error-message" id="error-email"></div>
          </div>

          <div class="form-group">
            <label class="label" for="tipo">Tipo de feedback</label>
            <select
              class="input select"
              id="tipo"
              name="tipo"
              required
            >
              <option value="" disabled selected>Selecione uma opção</option>
              <option value="bug">Bug</option>
              <option value="sugestao">Sugestão</option>
              <option value="elogio">Elogio</option>
            </select>
            <div class="error-message" id="error-tipo"></div>
          </div>

          <div class="form-group" id="severidade-group" style="display: none;">
            <label class="label" for="severidade">Severidade</label>
            <select
              class="input select"
              id="severidade"
              name="severidade"
            >
              <option value="" disabled selected>Selecione uma opção</option>
              <option value="baixa">Baixa</option>
              <option value="media">Média</option>
              <option value="alta">Alta</option>
              <option value="critica">Crítica</option>
            </select>
            <div class="error-message" id="error-severidade"></div>
          </div>

          <div class="form-group">
            <label class="label" for="descricao">Descrição</label>
            <textarea
              class="input"
              id="descricao"
              name="descricao"
              placeholder="Descreva seu feedback com o máximo de detalhes possível..."
              required
              rows="5"
            ></textarea>
            <div class="error-message" id="error-descricao"></div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar feedback</button>
        </form>

        <div class="auth-footer">
          <a href="/beta">&larr; Voltar para a página do beta</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="../../js/app.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
