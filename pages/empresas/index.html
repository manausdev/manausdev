<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empresas | ManausDev</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <header class="navbar" role="banner">
    <a href="/#home" class="navbar-brand">ManausDev</a>
    <nav aria-label="Navegação principal">
      <ul class="navbar-nav">
        <li><a href="/#developers" class="nav-link" data-route="developers">Desenvolvedores</a></li>
        <li><a href="/#projects" class="nav-link" data-route="projects">Projetos</a></li>
        <li><a href="/#companies" class="nav-link active" data-route="companies">Empresas</a></li>
        <li><a href="/#jobs" class="nav-link" data-route="jobs">Vagas</a></li>
        <li><a href="/#events" class="nav-link" data-route="events">Eventos</a></li>
        <li><a href="/#communities" class="nav-link" data-route="communities">Comunidades</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" role="main">
    <section class="section" aria-labelledby="page-title">
      <div class="container">
        <h1 id="page-title">Empresas</h1>
        <p class="text-secondary" data-search-result-count>Conheça as empresas da comunidade</p>
      </div>

      <div class="container">
        <form class="filters" id="companies-filters" data-component="filters" aria-label="Filtros de empresas">
          <div class="filters__row">
            <div class="form-group">
              <label class="label" for="company-search">Buscar por nome</label>
              <input
                type="search"
                id="company-search"
                class="input"
                placeholder="Ex: TechNorte"
                data-filter="search"
                autocomplete="off"
              >
            </div>
          </div>
        </form>

        <div id="companies-grid" class="grid grid--3" data-component="grid" role="list" aria-label="Lista de empresas">
          <p class="text-secondary" id="companies-empty">Nenhuma empresa encontrada.</p>
        </div>

        <nav class="pagination" id="companies-pagination" data-component="pagination" aria-label="Paginação de empresas">
        </nav>
      </div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="footer-content">
      <p class="footer-text"> ManausDev. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/pages/empresas/main.js"></script>
</body>
</html>
