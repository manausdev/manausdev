<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderação - ManausDev</title>
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <main class="dashboard-layout">
    <aside class="sidebar" data-open="true" aria-label="Menu lateral">
      <div class="sidebar-header">
        <a href="/" class="navbar-brand">ManausDev</a>
      </div>
      <nav class="sidebar-nav" aria-label="Navegação da moderação">
        <ul class="navbar-nav">
          <li><a href="/moderacao" class="nav-link active">Painel</a></li>
          <li><a href="/moderacao?tab=denuncias" class="nav-link">Denúncias</a></li>
          <li><a href="/moderacao?tab=usuarios" class="nav-link">Usuários</a></li>
          <li><a href="/moderacao?tab=conteudo" class="nav-link">Conteúdo</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <a href="/" class="nav-link">Voltar para o site</a>
      </div>
    </aside>

    <div class="dashboard-main">
      <div class="dashboard-content">
        <div id="access-denied" class="auth-page" style="display: none;">
          <div class="auth-container">
            <div class="card">
              <div class="card-header">
                <h1 class="card-title">Acesso restrito</h1>
                <p class="card-body">Esta página é visível apenas para administradores e moderadores.</p>
              </div>
              <a href="/login" class="btn btn-primary" style="width: 100%;">Entrar com outra conta</a>
            </div>
          </div>
        </div>

        <div id="moderation-panel">
          <header style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-4);">
            <h1 style="font-size: var(--text-3xl); font-weight: var(--weight-bold);">Painel de Moderação</h1>
            <span class="badge badge-primary" id="queue-count">0 itens na fila</span>
          </header>

          <div class="tabs" role="tablist" aria-label="Categorias de moderação">
            <button class="tabs__tab tabs__tab--active" role="tab" aria-selected="true" aria-controls="panel-denuncias" id="tab-denuncias" data-tab="denuncias">Denúncias</button>
            <button class="tabs__tab" role="tab" aria-selected="false" aria-controls="panel-usuarios" id="tab-usuarios" data-tab="usuarios">Usuários</button>
            <button class="tabs__tab" role="tab" aria-selected="false" aria-controls="panel-conteudo" id="tab-conteudo" data-tab="conteudo">Conteúdo</button>
          </div>

          <section id="panel-denuncias" class="dashboard-section" role="tabpanel" aria-labelledby="tab-denuncias">
            <div class="card" style="margin-bottom: var(--space-6);">
              <div class="card-header" style="display: flex; align-items: center; justify-content: space-between;">
                <h2 class="card-title">Fila de denúncias</h2>
                <div class="filters__row" style="display: flex; gap: var(--space-3);">
                  <select class="input select" id="filter-denuncias-status" aria-label="Filtrar por status">
                    <option value="pendente">Pendentes</option>
                    <option value="resolvida">Resolvidas</option>
                    <option value="todos">Todas</option>
                  </select>
                </div>
              </div>
              <div class="card-body">
                <div id="denuncias-list" class="grid grid--3"></div>
              </div>
            </div>
          </section>

          <section id="panel-usuarios" class="dashboard-section" role="tabpanel" aria-labelledby="tab-usuarios" hidden>
            <div class="card" style="margin-bottom: var(--space-6);">
              <div class="card-header" style="display: flex; align-items: center; justify-content: space-between;">
                <h2 class="card-title">Usuários reportados</h2>
                <div class="filters__row" style="display: flex; gap: var(--space-3);">
                  <select class="input select" id="filter-usuarios-status" aria-label="Filtrar usuários por status">
                    <option value="ativos">Ativos</option>
                    <option value="suspensos">Suspensos</option>
                    <option value="banidos">Banidos</option>
                    <option value="todos">Todos</option>
                  </select>
                </div>
              </div>
              <div class="card-body">
                <div id="usuarios-list" class="grid grid--3"></div>
              </div>
            </div>
          </section>

          <section id="panel-conteudo" class="dashboard-section" role="tabpanel" aria-labelledby="tab-conteudo" hidden>
            <div class="card" style="margin-bottom: var(--space-6);">
              <div class="card-header" style="display: flex; align-items: center; justify-content: space-between;">
                <h2 class="card-title">Conteúdo em análise</h2>
                <div class="filters__row" style="display: flex; gap: var(--space-3);">
                  <select class="input select" id="filter-conteudo-status" aria-label="Filtrar conteúdo por status">
                    <option value="pendente">Pendentes</option>
                    <option value="aprovado">Aprovados</option>
                    <option value="rejeitado">Rejeitados</option>
                    <option value="todos">Todos</option>
                  </select>
                </div>
              </div>
              <div class="card-body">
                <div id="conteudo-list" class="grid grid--3"></div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="../../js/app.js"></script>
  <script type="module" src="../../js/auth.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
