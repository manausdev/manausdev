<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos | ManausDev</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <header class="navbar" role="banner">
    <a href="/#home" class="navbar-brand">ManausDev</a>
    <nav aria-label="Navegação principal">
      <ul class="navbar-nav">
        <li><a href="/#developers" class="nav-link" data-route="developers">Desenvolvedores</a></li>
        <li><a href="/#projects" class="nav-link" data-route="projects">Projetos</a></li>
        <li><a href="/#companies" class="nav-link" data-route="companies">Empresas</a></li>
        <li><a href="/#jobs" class="nav-link" data-route="jobs">Vagas</a></li>
        <li><a href="/#events" class="nav-link active" data-route="events">Eventos</a></li>
        <li><a href="/#communities" class="nav-link" data-route="communities">Comunidades</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" role="main">
    <section class="section" aria-labelledby="page-title">
      <div class="container">
        <h1 id="page-title">Eventos</h1>
        <p class="text-secondary" data-search-result-count>Participe de eventos da comunidade</p>
      </div>

      <div class="container">
        <div class="tabs" role="tablist" aria-label="Filtro de eventos">
          <button class="tabs__tab tabs__tab--active" role="tab" aria-selected="true" data-tab="upcoming" id="tab-upcoming">Próximos</button>
          <button class="tabs__tab" role="tab" aria-selected="false" data-tab="past" id="tab-past">Anteriores</button>
        </div>

        <div id="events-grid" class="grid grid--3" data-component="grid" role="list" aria-label="Lista de eventos">
          <p class="text-secondary" id="events-empty">Nenhum evento encontrado.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="footer-content">
      <p class="footer-text"> ManausDev. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/pages/eventos/main.js"></script>
</body>
</html>
