<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - ManausDev</title>
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-container">
      <div class="card">
        <div class="card-header">
          <h1 class="card-title">Criar conta</h1>
          <p class="card-body">Junte-se à comunidade ManausDev</p>
        </div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label class="label" for="name">Nome completo</label>
            <input
              class="input"
              type="text"
              id="name"
              name="name"
              placeholder="Seu nome"
              required
              autocomplete="name"
            >
          </div>

          <div class="form-group">
            <label class="label" for="email">Email</label>
            <input
              class="input"
              type="email"
              id="email"
              name="email"
              placeholder="seu@email.com"
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label class="label" for="password">Senha</label>
            <input
              class="input"
              type="password"
              id="password"
              name="password"
              placeholder="********"
              required
              autocomplete="new-password"
            >
          </div>

          <div class="form-group">
            <label class="label" for="confirmPassword">Confirmar senha</label>
            <input
              class="input"
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="********"
              required
              autocomplete="new-password"
            >
          </div>

          <div class="form-group">
            <label class="label" for="github">GitHub</label>
            <input
              class="input"
              type="url"
              id="github"
              name="github"
              placeholder="https://github.com/seu-usuario"
              autocomplete="url"
            >
          </div>

          <div class="form-group">
            <label class="label" for="linkedin">LinkedIn</label>
            <input
              class="input"
              type="url"
              id="linkedin"
              name="linkedin"
              placeholder="https://linkedin.com/in/seu-usuario"
              autocomplete="url"
            >
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Cadastrar</button>
        </form>

        <div class="auth-footer">
          <a href="#login">Já tem conta? Entrar</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="../../js/auth.js"></script>
  <script type="module" src="../../js/app.js"></script>
  <script type="module" src="main.js"></script>
  <script type="module" src="register.js"></script>
</body>
</html>
