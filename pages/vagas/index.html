<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vagas | ManausDev</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <header class="navbar" role="banner">
    <a href="/#home" class="navbar-brand">ManausDev</a>
    <nav aria-label="Navegação principal">
      <ul class="navbar-nav">
        <li><a href="/#developers" class="nav-link" data-route="developers">Desenvolvedores</a></li>
        <li><a href="/#projects" class="nav-link" data-route="projects">Projetos</a></li>
        <li><a href="/#companies" class="nav-link" data-route="companies">Empresas</a></li>
        <li><a href="/#jobs" class="nav-link active" data-route="jobs">Vagas</a></li>
        <li><a href="/#events" class="nav-link" data-route="events">Eventos</a></li>
        <li><a href="/#communities" class="nav-link" data-route="communities">Comunidades</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" role="main">
    <section class="section" aria-labelledby="page-title">
      <div class="container">
        <h1 id="page-title">Vagas</h1>
        <p class="text-secondary" data-search-result-count>Encontre oportunidades na região</p>
      </div>

      <div class="container">
        <form class="filters" id="jobs-filters" data-component="filters" aria-label="Filtros de vagas">
          <div class="filters__row">
            <div class="form-group">
              <label class="label" for="job-search">Buscar por cargo</label>
              <input
                type="search"
                id="job-search"
                class="input"
                placeholder="Ex: Frontend Developer"
                data-filter="search"
                autocomplete="off"
              >
            </div>

            <div class="form-group">
              <label class="label" for="type-select">Tipo</label>
              <select id="type-select" class="select input" data-filter="type">
                <option value="">Todos</option>
                <option value="CLT">CLT</option>
                <option value="PJ">PJ</option>
                <option value="Estágio">Estágio</option>
                <option value="Freelancer">Freelancer</option>
              </select>
            </div>

            <div class="form-group">
              <label class="label" for="modality-select">Modalidade</label>
              <select id="modality-select" class="select input" data-filter="modality">
                <option value="">Todas</option>
                <option value="Presencial">Presencial</option>
                <option value="Híbrido">Híbrido</option>
                <option value="Remoto">Remoto</option>
              </select>
            </div>

            <div class="form-group">
              <label class="label" for="seniority-select">Senioridade</label>
              <select id="seniority-select" class="select input" data-filter="seniority">
                <option value="">Todas</option>
                <option value="junior">Júnior</option>
                <option value="pleno">Pleno</option>
                <option value="senior">Sênior</option>
                <option value="lead">Lead</option>
              </select>
            </div>
          </div>

          <div class="filters__actions">
            <button type="button" class="btn btn-secondary" id="clear-job-filters">Limpar filtros</button>
          </div>
        </form>

        <div id="jobs-grid" class="grid grid--3" data-component="grid" role="list" aria-label="Lista de vagas">
          <p class="text-secondary" id="jobs-empty">Nenhuma vaga encontrada.</p>
        </div>

        <nav class="pagination" id="jobs-pagination" data-component="pagination" aria-label="Paginação de vagas">
        </nav>
      </div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="footer-content">
      <p class="footer-text"> ManausDev. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/pages/vagas/main.js"></script>
</body>
</html>
