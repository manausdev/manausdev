<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vagas | ManausDev</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/utilities.css" />
</head>
<body class="bg-background text-on-background font-body-base antialiased flex h-screen overflow-hidden">
  <!-- SideNavBar -->
  <nav class="bg-surface h-full w-64 fixed left-0 top-0 hidden lg:flex flex-col bg-surface-container-low shadow-md z-40 border-r border-outline-variant/30">
    <div class="p-6 mb-4">
      <div class="flex items-center gap-3 mb-2">
        <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center">
          <span class="material-symbols-outlined text-on-primary-container">hub</span>
        </div>
        <div>
          <h1 class="font-headline-card text-headline-card text-primary-container">ManausDev</h1>
          <p class="font-body-sm text-body-sm text-on-surface-variant">Amazonas Tech Scene</p>
        </div>
      </div>
    </div>
    <div class="flex flex-col p-4 gap-2 flex-1">
      <a class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-variant/50 mx-2 my-1 rounded-xl cursor-pointer transition-all hover:translate-x-1" href="/#home">
        <span class="material-symbols-outlined">home</span>
        <span class="font-label-caps text-label-caps">Início</span>
      </a>
      <a class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-variant/50 mx-2 my-1 rounded-xl cursor-pointer transition-all hover:translate-x-1" href="/projetos">
        <span class="material-symbols-outlined">terminal</span>
        <span class="font-label-caps text-label-caps">Projetos</span>
      </a>
      <a class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-variant/50 mx-2 my-1 rounded-xl cursor-pointer transition-all hover:translate-x-1" href="/devs">
        <span class="material-symbols-outlined">groups</span>
        <span class="font-label-caps text-label-caps">Desenvolvedores</span>
      </a>
      <a class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-variant/50 mx-2 my-1 rounded-xl cursor-pointer transition-all hover:translate-x-1" href="/empresas">
        <span class="material-symbols-outlined">business</span>
        <span class="font-label-caps text-label-caps">Empresas</span>
      </a>
      <a class="flex items-center gap-3 p-3 bg-primary-container text-on-primary-container rounded-xl mx-2 my-1 cursor-pointer transition-all" href="/vagas">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">work</span>
        <span class="font-label-caps text-label-caps">Vagas</span>
      </a>
      <a class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-variant/50 mx-2 my-1 rounded-xl cursor-pointer transition-all hover:translate-x-1" href="/eventos">
        <span class="material-symbols-outlined">event</span>
        <span class="font-label-caps text-label-caps">Eventos</span>
      </a>
      <a class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-variant/50 mx-2 my-1 rounded-xl cursor-pointer transition-all hover:translate-x-1" href="/comunidades">
        <span class="material-symbols-outlined">forum</span>
        <span class="font-label-caps text-label-caps">Comunidades</span>
      </a>
    </div>
    <div class="p-4 mt-auto">
      <a href="/vagas/nova" class="w-full bg-primary-container text-on-primary-container font-label-caps text-label-caps py-3 rounded-lg shadow-sm hover:shadow-md transition-shadow text-center block">
        Publicar vaga
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 lg:ml-64 h-full overflow-y-auto relative bg-background">
    <div class="absolute inset-0 pointer-events-none opacity-10" style="background-image: radial-gradient(circle at 2px 2px, #00dce5 1px, transparent 0); background-size: 32px 32px;"></div>
    <div class="max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-12 md:py-16 relative z-10">
      <!-- Page Header -->
      <header class="mb-12">
        <h2 class="font-display-hero-mobile md:font-display-hero text-display-hero-mobile md:text-display-hero text-on-background mb-4">Vagas</h2>
        <p class="font-body-base text-body-base text-on-surface-variant max-w-2xl">
          Encontre oportunidades de trabalho em empresas de tecnologia de Manaus e região.
        </p>
      </header>

      <!-- Filters -->
      <section class="mb-10 flex flex-wrap gap-3">
        <input type="search" id="job-search" class="input filter-input" placeholder="Buscar vagas..." />
        <select id="type-select" class="input select filter-input">
          <option value="">Todos os tipos</option>
          <option value="CLT">CLT</option>
          <option value="PJ">PJ</option>
          <option value="Estágio">Estágio</option>
          <option value="Freelancer">Freelancer</option>
        </select>
        <select id="modality-select" class="input select filter-input">
          <option value="">Todas as modalidades</option>
          <option value="Presencial">Presencial</option>
          <option value="Híbrido">Híbrido</option>
          <option value="Remoto">Remoto</option>
        </select>
        <select id="seniority-select" class="input select filter-input">
          <option value="">Todas as senioridades</option>
          <option value="junior">Júnior</option>
          <option value="pleno">Pleno</option>
          <option value="senior">Sênior</option>
          <option value="lead">Lead</option>
        </select>
        <button type="button" class="px-5 py-2 rounded-full bg-surface-container text-on-surface font-label-caps text-label-caps shadow-sm border border-outline-variant/30 hover:border-primary-container hover:text-primary-container transition-all" id="clear-job-filters">
          Limpar filtros
        </button>
      </section>

      <!-- Jobs Grid -->
      <div id="jobs-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-gutter-desktop" role="list" aria-label="Lista de vagas">
        <p class="text-secondary" id="jobs-empty">Nenhuma vaga encontrada.</p>
      </div>

      <!-- Pagination -->
      <nav id="jobs-pagination" class="pagination" aria-label="Paginação de vagas"></nav>
    </div>
  </main>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/pages/vagas/main.js"></script>
</body>
</html>
