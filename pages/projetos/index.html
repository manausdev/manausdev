<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projetos | ManausDev</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <header class="navbar" role="banner">
    <a href="/#home" class="navbar-brand">ManausDev</a>
    <nav aria-label="Navegação principal">
      <ul class="navbar-nav">
        <li><a href="/#developers" class="nav-link" data-route="developers">Desenvolvedores</a></li>
        <li><a href="/#projects" class="nav-link active" data-route="projects">Projetos</a></li>
        <li><a href="/#jobs" class="nav-link" data-route="jobs">Vagas</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" role="main">
    <section class="section" aria-labelledby="page-title">
      <div class="container">
        <h1 id="page-title">Projetos</h1>
        <p class="text-secondary" data-search-result-count>Explore projetos da comunidade</p>
      </div>

      <div class="container">
        <form class="filters" id="projects-filters" data-component="filters" aria-label="Filtros de projetos">
          <div class="filters__row">
            <div class="form-group">
              <label class="label" for="project-search">Buscar por nome</label>
              <input
                type="search"
                id="project-search"
                class="input"
                placeholder="Ex: E-commerce Local"
                data-filter="search"
                autocomplete="off"
              >
            </div>

            <div class="form-group">
              <label class="label" for="stack-select">Stack</label>
              <select id="stack-select" class="select input" data-filter="stack">
                <option value="">Todas</option>
              </select>
            </div>

            <div class="form-group">
              <label class="label" for="status-select">Status</label>
              <select id="status-select" class="select input" data-filter="status">
                <option value="">Todos</option>
                <option value="planning">Planejamento</option>
                <option value="active">Em andamento</option>
                <option value="completed">Concluído</option>
                <option value="paused">Pausado</option>
              </select>
            </div>

            <div class="form-group">
              <label class="label" for="sort-select">Ordenação</label>
              <select id="sort-select" class="select input" data-filter="sort">
                <option value="recent">Mais recentes</option>
                <option value="popular">Mais populares</option>
                <option value="name-asc">Nome A-Z</option>
                <option value="name-desc">Nome Z-A</option>
              </select>
            </div>
          </div>

          <div class="filters__actions">
            <button type="button" class="btn btn-secondary" id="clear-project-filters">Limpar filtros</button>
          </div>
        </form>

        <div id="projects-grid" class="grid grid--3" data-component="grid" role="list" aria-label="Lista de projetos">
          <p class="text-secondary" id="projects-empty">Nenhum projeto encontrado.</p>
        </div>

        <nav class="pagination" id="projects-pagination" data-component="pagination" aria-label="Paginação de projetos">
        </nav>
      </div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="footer-content">
      <p class="footer-text"> ManausDev. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/pages/projetos/main.js"></script>
</body>
</html>
