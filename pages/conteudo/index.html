<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteúdo | ManausDev</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <header class="navbar" role="banner">
    <a href="/#home" class="navbar-brand">ManausDev</a>
    <nav aria-label="Navegação principal">
      <ul class="navbar-nav">
        <li><a href="/#developers" class="nav-link" data-route="developers">Desenvolvedores</a></li>
        <li><a href="/#projects" class="nav-link" data-route="projects">Projetos</a></li>
        <li><a href="/#jobs" class="nav-link" data-route="jobs">Vagas</a></li>
        <li><a href="/#events" class="nav-link" data-route="events">Eventos</a></li>
        <li><a href="/#communities" class="nav-link" data-route="communities">Comunidades</a></li>
        <li><a href="/conteudo" class="nav-link active" data-route="content">Conteúdo</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" role="main">
    <section class="section" aria-labelledby="page-title">
      <div class="container">
        <h1 id="page-title">Conteúdo</h1>
        <p class="text-secondary" data-search-result-count>Artigos, tutoriais e mais da comunidade</p>
      </div>

      <div class="container">
        <div class="tabs" role="tablist" aria-label="Categorias de conteúdo">
          <button class="tabs__tab tabs__tab--active" role="tab" aria-selected="true" data-tab="todos" id="tab-todos">Todos</button>
          <button class="tabs__tab" role="tab" aria-selected="false" data-tab="artigos" id="tab-artigos">Artigos</button>
          <button class="tabs__tab" role="tab" aria-selected="false" data-tab="tutoriais" id="tab-tutoriais">Tutoriais</button>
          <button class="tabs__tab" role="tab" aria-selected="false" data-tab="relatos" id="tab-relatos">Relatos</button>
          <button class="tabs__tab" role="tab" aria-selected="false" data-tab="pesquisa" id="tab-pesquisa">Pesquisa</button>
          <button class="tabs__tab" role="tab" aria-selected="false" data-tab="academico" id="tab-academico">Conteúdo acadêmico</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr; gap: var(--space-6);">
          <div style="min-width: 0;">
            <div id="content-grid" class="grid grid--3" data-component="grid" role="list" aria-label="Lista de conteúdo">
              <p class="text-secondary" id="content-empty">Nenhum conteúdo encontrado.</p>
            </div>
          </div>

          <aside class="card" aria-label="Tags populares" style="height: fit-content;">
            <div class="card-header">
              <h3 class="card-title">Tags populares</h3>
            </div>
            <div class="card-body">
              <div id="popular-tags" class="tags" style="margin-top: 0;"></div>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="footer-content">
      <p class="footer-text"> ManausDev. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/pages/conteudo/main.js"></script>
</body>
</html>
