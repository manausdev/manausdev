<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desenvolvedores | ManausDev</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <header class="navbar" role="banner">
    <a href="/#home" class="navbar-brand">ManausDev</a>
    <nav aria-label="Navegação principal">
      <ul class="navbar-nav">
        <li><a href="/#developers" class="nav-link active" data-route="developers">Desenvolvedores</a></li>
        <li><a href="/#projects" class="nav-link" data-route="projects">Projetos</a></li>
        <li><a href="/#jobs" class="nav-link" data-route="jobs">Vagas</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" role="main">
    <section class="section" aria-labelledby="page-title">
      <div class="container">
        <h1 id="page-title">Desenvolvedores</h1>
        <p class="text-secondary" data-search-result-count>Encontre desenvolvedores na região</p>
      </div>

      <div class="container">
        <form class="filters" id="devs-filters" data-component="filters" aria-label="Filtros de desenvolvedores">
          <div class="filters__row">
            <div class="form-group">
              <label class="label" for="search-input">Buscar por nome</label>
              <input
                type="search"
                id="search-input"
                class="input"
                placeholder="Ex: Ana Silva"
                data-filter="search"
                autocomplete="off"
              >
            </div>

            <div class="form-group">
              <label class="label" for="tech-select">Tecnologia</label>
              <select id="tech-select" class="select input" data-filter="tech">
                <option value="">Todas</option>
              </select>
            </div>

            <div class="form-group">
              <label class="label" for="area-select">Área</label>
              <select id="area-select" class="select input" data-filter="area">
                <option value="">Todas</option>
                <option value="frontend">Frontend</option>
                <option value="backend">Backend</option>
                <option value="fullstack">Fullstack</option>
                <option value="mobile">Mobile</option>
                <option value="devops">DevOps</option>
                <option value="data">Data</option>
                <option value="design">Design</option>
              </select>
            </div>

            <div class="form-group">
              <label class="label" for="level-select">Senioridade</label>
              <select id="level-select" class="select input" data-filter="level">
                <option value="">Todas</option>
                <option value="junior">Júnior</option>
                <option value="pleno">Pleno</option>
                <option value="senior">Sênior</option>
                <option value="lead">Lead</option>
              </select>
            </div>

            <div class="form-group">
              <label class="label" for="availability-select">Disponibilidade</label>
              <select id="availability-select" class="select input" data-filter="availability">
                <option value="">Todas</option>
                <option value="available">Disponível</option>
                <option value="unavailable">Indisponível</option>
              </select>
            </div>
          </div>

          <div class="filters__actions">
            <button type="button" class="btn btn-secondary" id="clear-filters">Limpar filtros</button>
          </div>
        </form>

        <div id="devs-grid" class="grid grid--3" data-component="grid" role="list" aria-label="Lista de desenvolvedores">
          <p class="text-secondary" id="devs-empty">Nenhum desenvolvedor encontrado.</p>
        </div>

        <nav class="pagination" id="devs-pagination" data-component="pagination" aria-label="Paginação de desenvolvedores">
        </nav>
      </div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="footer-content">
      <p class="footer-text"> ManausDev. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/pages/devs/main.js"></script>
</body>
</html>
