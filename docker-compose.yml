name: manausdev

services:
  web:
    container_name: manausdev-web
    build:
      context: .
      dockerfile: Dockerfile
    image: manausdev:latest
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
